spring.application.name=Douglas
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.jpa.database-platform=${DB_PLATFORM}
spring.jackson.mapper.SORT_PROPERTIES_ALPHABETICALLY=false

# Credenciales de Cloudinary con valores de respaldo
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:prueba}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:123456}

# Límites de tamaño para las subidas
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Tope de registros por página para los endpoints que reciben un Pageable (evaluaciones).
# Ahí no aplican las anotaciones @Min/@Max de los controladores, porque Spring arma
# el objeto por su cuenta; sin esta línea el máximo sería el suyo, de 2000 registros.
spring.data.web.pageable.max-page-size=50

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# GROQ
# Clave de la API
groq.api-key=${GROQ_API_KEY}
# Nombre del modelo de GROQ
groq.model=${GROQ_MODEL}
# Servicio (IA) a la que se conectara nuestra API
groq.base-url=https://api.groq.com/openai/v1

#para auth
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER}
jwt.expiration=${JWT_EXPIRATION}
cookie.secure=${COOKIE_SECURE}
cookie.samesite=${COOKIE_SAMESITE}

#recup,,,,,,,,,,,,,,,,,,
spring.mail.host=${SMTP_GOOGLE}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
