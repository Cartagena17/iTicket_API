spring.application.name=Douglas
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.jpa.database-platform=${DB_PLATFORM}
spring.jackson.mapper.SORT_PROPERTIES_ALPHABETICALLY=false

# Credenciales de Cloudinary con valores de respaldo
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:prueba}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:123456}

# Límites de tamaño para las subidas
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# GROQ
# Clave de la API
groq.api-key=${GROQ_API_KEY} 
# Nombre del modelo de GROQ
groq.model=${GROQ_MODEL}
# Servicio (IA) a la que se conectara nuestra API
groq.base-url=https://api.groq.com/openai/v1